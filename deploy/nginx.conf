events { worker_connections 1024; }

http {
  upstream gateway {
    server gateway-1:8080;
    server gateway-2:8080;
    server gateway-3:8080;
    keepalive 64;                 # reuse connections to the gateways
  }

  server {
    listen 8080;

    # Prometheus scrapes the gateways directly on the internal network;
    # don't expose metrics through the public entrypoint.
    location = /metrics { return 404; }

    location / {
      proxy_pass         http://gateway;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
