x-gateway-env: &gateway-env
  DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
  REDIS_ADDR: redis:6379
  JWT_SECRET: dev-only-change-me
  BACKEND_URL: http://backend:80
  LOG_MODE: ${LOG_MODE:-async}        # toggle: sync | async
  GIN_MODE: release
  ALLOW_SELF_SERVE_PREMIUM: "true"    # dev/demo only; keep off in production

x-gateway: &gateway
  build: .
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
    backend:  { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # Local upstream (nginx welcome page) so benchmarks don't depend on the internet.
  backend:
    image: nginx:alpine
    restart: on-failure

  gateway-1:
    <<: *gateway
    environment: { <<: *gateway-env, INSTANCE_ID: gateway-1 }

  gateway-2:
    <<: *gateway
    environment: { <<: *gateway-env, INSTANCE_ID: gateway-2 }

  gateway-3:
    <<: *gateway
    environment: { <<: *gateway-env, INSTANCE_ID: gateway-3 }

  nginx:
    image: nginx:alpine
    ports:
      - "8088:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [gateway-1, gateway-2, gateway-3]

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
